<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>G.U.I.D.E. - Emergency Roster Lookup</title>
    
    <!-- PWA / Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#dc3545" id="metaThemeColor">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Emergency Finder">

    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #333333;
            --card-bg: #ffffff;
            --header-title: #dc3545;
            --subtext-color: #666666;
            --border-color: #eeeeee;
            --input-border: #cccccc;
            --input-bg: #ffffff;
            --toast-bg: rgba(0,0,0,0.85);
            --toast-text: #ffffff;
            --result-bg: #fff3f3;
            --result-border: #dc3545;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --header-title: #ff4d5e;
            --subtext-color: #aaaaaa;
            --border-color: #333333;
            --input-border: #444444;
            --input-bg: #2a2a2a;
            --toast-bg: rgba(255,255,255,0.95);
            --toast-text: #121212;
            --result-bg: #2c1a1d;
            --result-border: #ff4d5e;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 10px; 
            background: var(--bg-color); 
            color: var(--text-color); 
            touch-action: manipulation; 
            transition: background 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .header { 
            text-align: center; 
            margin-bottom: 15px; 
            position: relative;
        }
        .header h1 { font-size: 1.4em; color: var(--header-title); margin: 0; letter-spacing: 1px; }
        .header p { font-size: 0.85em; color: var(--subtext-color); margin: 2px 0 10px 0; }
        
        .theme-toggle-btn {
            position: absolute;
            top: 0;
            right: 5px;
            background: transparent;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            padding: 5px;
            width: auto;
        }

        .card { 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            margin-bottom: 15px; 
            transition: background 0.3s ease;
        }
        
        h3 { margin-top: 0; font-size: 1.1em; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; color: var(--header-title); text-align: center; }
        
        button { 
            width: 100%; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            font-weight: bold; 
            margin: 5px 0; 
            font-size: 15px; 
            cursor: pointer; 
            transition: opacity 0.2s, transform 0.1s; 
        }
        button:active { opacity: 0.7; transform: scale(0.98); }
        button:disabled { background: #ccc !important; color: #666 !important; cursor: not-allowed; opacity: 0.6; }
        
        .btn-primary { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-sync { background: #28a745; color: white; }
        
        #quick-toast { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); 
            background: var(--toast-bg); color: var(--toast-text); padding: 16px 30px; 
            border-radius: 50px; font-size: 16px; font-weight: bold;
            display: none; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center; min-width: 200px;
        }

        #reader { width: 100%; max-width: 350px; aspect-ratio: 1/1; border-radius: 12px; background: #000; margin: 0 auto; overflow: hidden; }
        #reader #reader__scan_region { border: none !important; }
        #reader #reader__scan_region img { display: none !important; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }

        .result-card { 
            background: var(--result-bg); 
            padding: 20px; 
            border-radius: 12px; 
            margin-top: 15px; 
            border: 2px solid var(--result-border); 
            text-align: center; 
        }
        .result-card .name { font-size: 22px; font-weight: bold; color: var(--text-color); margin: 8px 0; }
        .result-card .badge { display: inline-block; background: #dc3545; color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 16px; margin-top: 5px; }

        #status { font-weight: bold; margin-bottom: 10px; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px; background: var(--card-bg); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        
        .search-row { display: flex; gap: 5px; margin-bottom: 10px; justify-content: center; }
        .search-row input { flex: 1; max-width: 250px; padding: 12px; border-radius: 8px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); font-size: 16px; text-align: center; }
        
        #searchList { max-height: 220px; overflow-y: auto; background: var(--card-bg); border-radius: 8px; margin-bottom: 10px; display: none; border: 1px solid var(--border-color); }
        .search-item { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; }

        #toast-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(3px); }
        .toast-box { background: var(--card-bg); color: var(--text-color); padding: 22px; border-radius: 16px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }

        #installBanner {
            display: none; background: #dc3545; color: white; padding: 10px; 
            border-radius: 8px; margin-bottom: 15px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="installBanner">
        <span>Install Emergency Tracker App</span>
        <button id="installBtn" style="width: auto; padding: 6px 15px; margin-left: 10px; display: inline-block; background: white; color: #dc3545;">Install</button>
    </div>

    <div class="header">
        <h1>🚨 EMERGENCY FINDER</h1>
        <p>Student & Parent Verification System</p>
        <button class="theme-toggle-btn" id="themeBtn" onclick="toggleDarkMode()" title="Toggle Dark Mode">🌙</button>
    </div>

    <div id="status">Loading...</div>

    <div id="toast-overlay">
        <div class="toast-box">
            <p id="toast-msg" style="margin-top:0; font-size:15px; line-height:1.4;"></p>
            <button class="btn-primary" style="width:auto; min-width:100px; padding: 10px 25px; margin-top:10px;" onclick="hideNotify()">OK</button>
        </div>
    </div>

    <div id="quick-toast"></div>

    <div class="card" style="text-align: center;">
        <h3>Emergency QR Scanner</h3>
        <button id="startBtn" class="btn-primary" onclick="initScanner()">Open Camera</button>
        <div id="reader"></div>

        <div id="scanResult" style="display:none;" class="result-card">
            <span style="font-size: 12px; color: var(--subtext-color); font-weight: bold; letter-spacing: 1px;">STUDENT IDENTIFIED</span>
            <div class="name" id="nameText">---</div>
            <div class="badge" id="infoBadge">Grade -- | Section --</div>
            <p style="margin-top: 10px; font-size: 12px; color: var(--subtext-color);">LRN: <span id="lrnText"></span></p>
            <button class="btn-secondary" style="margin-top: 15px;" onclick="resetDisplay()">Scan Next Code</button>
        </div>
    </div>

    <div class="card">
        <h3>Manual Search</h3>
        <div class="search-row">
            <input type="text" id="nameInput" placeholder="Student name..." onkeyup="if(event.key === 'Enter') performSearch()">
            <button class="btn-primary" style="width:auto;" onclick="performSearch()">🔍</button>
        </div>
        <div id="searchList"></div>
    </div>

    <div class="card" style="text-align: center;">
        <h3>Database Sync</h3>
        <button id="syncRosterBtn" class="btn-sync" onclick="syncRoster()">📥 Sync Roster from Sheet</button>
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border-color);">
        <input type="file" id="csvFile" accept=".csv" style="font-size: 11px; margin-bottom:10px; color: var(--text-color);">
        <button class="btn-secondary" onclick="uploadCSV()">Import Local CSV File</button>
    </div>

    <script>
        // --- PUBLISHED GOOGLE SHEET URL ---
        const ROSTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiNJ2cC86hHefg8sqPRogUQlVw5Zu9oXvkLvZLvj9i8VaMMoID9wfe1svMT7CWDVWtMWAzUkxAHsKH/pub?output=csv";

        // --- DARK MODE LOGIC ---
        function initTheme() {
            const savedTheme = localStorage.getItem('emergency_theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').innerText = '☀️';
                document.getElementById('metaThemeColor').setAttribute('content', '#121212');
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeBtn').innerText = '🌙';
                document.getElementById('metaThemeColor').setAttribute('content', '#dc3545');
            }
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('emergency_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
            document.getElementById('metaThemeColor').setAttribute('content', isDark ? '#121212' : '#dc3545');
        }

        // --- FULL OFFLINE PWA SERVICE WORKER ---
        (function setupPWA() {
            const manifestData = {
                name: "Emergency Student Finder",
                short_name: "Emergency Finder",
                start_url: "./",
                display: "standalone",
                background_color: "#121212",
                theme_color: "#dc3545",
                icons: [{
                    src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23dc3545'/><text x='50%' y='65%' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>🚨</text></svg>",
                    sizes: "192x192 512x512",
                    type: "image/svg+xml"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(manifestBlob);
            document.head.appendChild(link);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE_NAME = 'emergency-finder-v4';
                    const ASSETS = [
                        './',
                        'https://unpkg.com/dexie@latest/dist/dexie.js',
                        'https://unpkg.com/html5-qrcode'
                    ];

                    self.addEventListener('install', (e) => {
                        e.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS))
                                .then(() => self.skipWaiting())
                        );
                    });

                    self.addEventListener('activate', (e) => {
                        e.waitUntil(
                            caches.keys().then((keys) => {
                                return Promise.all(
                                    keys.filter((key) => key !== CACHE_NAME).map((key) => caches.delete(key))
                                );
                            }).then(() => self.clients.claim())
                        );
                    });

                    self.addEventListener('fetch', (e) => {
                        if (e.request.url.includes('docs.google.com') || e.request.url.includes('script.google.com')) {
                            return;
                        }
                        e.respondWith(
                            caches.match(e.request).then((cachedResponse) => {
                                if (cachedResponse) return cachedResponse;
                                return fetch(e.request).then((networkResponse) => {
                                    if (networkResponse && networkResponse.status === 200 && e.request.method === 'GET') {
                                        const clone = networkResponse.clone();
                                        caches.open(CACHE_NAME).then((cache) => cache.put(e.request, clone));
                                    }
                                    return networkResponse;
                                });
                            })
                        );
                    });
                `;
                const swBlob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(swBlob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }

            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                const installBanner = document.getElementById('installBanner');
                if (installBanner) installBanner.style.display = 'block';

                const installBtn = document.getElementById('installBtn');
                if (installBtn) {
                    installBtn.addEventListener('click', () => {
                        installBanner.style.display = 'none';
                        deferredPrompt.prompt();
                        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
                    });
                }
            });
        })();

        // --- DATABASE SETUP ---
        const db = new Dexie("EmergencyStudentDB");
        db.version(1).stores({
            students: "LRN, Name, Grade, Section"
        });

        let scanner = null;
        let isScannerActive = false;
        let audioCtx = null;

        function showNotify(msg) {
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-overlay').style.display = "flex";
        }
        function hideNotify() { document.getElementById('toast-overlay').style.display = "none"; }

        function quickShow(msg) {
            const el = document.getElementById('quick-toast');
            el.innerText = msg;
            el.style.display = "block";
            setTimeout(() => { el.style.display = "none"; }, 2500);
        }

        async function playScanSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        document.addEventListener("DOMContentLoaded", async () => {
            initTheme();
            await refreshUI();
            if (navigator.onLine) {
                syncRoster(true); // Auto-sync silently on startup when online
            }
        });

        async function refreshUI() {
            const studentCount = await db.students.count();
            document.getElementById('status').innerText = studentCount > 0 
                ? `DATABASE READY: ${studentCount} Students Loaded` 
                : `⚠️ NO DATABASE LOADED. Fetch from Google Sheets or Upload CSV below.`;
        }

        // Quote-aware CSV parser
        function parseCSV(text) {
            const lines = [];
            let row = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(current.trim());
                    current = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') { i++; }
                    row.push(current.trim());
                    if (row.length > 0 && row.some(cell => cell.length > 0)) {
                        lines.push(row);
                    }
                    row = [];
                    current = '';
                } else {
                    current += char;
                }
            }
            if (current || row.length > 0) {
                row.push(current.trim());
                if (row.some(cell => cell.length > 0)) lines.push(row);
            }
            return lines;
        }

        async function syncRoster(silent = false) {
            if (!navigator.onLine) { 
                if (!silent) showNotify("No Internet Connection. Please go online to sync the roster."); 
                return; 
            }

            const btn = document.getElementById('syncRosterBtn');
            if (btn) {
                btn.disabled = true;
                btn.innerText = "Syncing Roster... ⏳";
            }

            try {
                if (scanner && scanner.getState() === Html5QrcodeScannerState.SCANNING) {
                    await stopScanner();
                    isScannerActive = false;
                    document.getElementById('startBtn').style.display = 'block';
                }

                const response = await fetch(ROSTER_CSV_URL);
                if (!response.ok) throw new Error("Failed to download CSV");

                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    if (!silent) showNotify("No valid student data found in Google Sheet CSV.");
                    return;
                }

                const headers = rows[0].map(h => h.toLowerCase());
                const lrnIndex = headers.findIndex(h => h.includes('lrn'));
                const nameIndex = headers.findIndex(h => h.includes('name'));
                const gradeIndex = headers.findIndex(h => h.includes('grade') || h.includes('level'));
                const sectionIndex = headers.findIndex(h => h.includes('section'));

                if (lrnIndex === -1 || nameIndex === -1) {
                    if (!silent) showNotify("CSV headers must contain LRN and NAME.");
                    return;
                }

                const students = [];
                for (let i = 1; i < rows.length; i++) {
                    const cleanCols = rows[i];
                    if (cleanCols[lrnIndex] && cleanCols[nameIndex]) {
                        students.push({
                            LRN: cleanCols[lrnIndex],
                            Name: cleanCols[nameIndex],
                            Grade: (gradeIndex !== -1 && cleanCols[gradeIndex]) ? cleanCols[gradeIndex] : 'N/A',
                            Section: (sectionIndex !== -1 && cleanCols[sectionIndex]) ? cleanCols[sectionIndex] : 'N/A'
                        });
                    }
                }

                if (students.length > 0) {
                    await db.students.clear();
                    await db.students.bulkPut(students);
                    if (!silent) showNotify(`Successfully updated roster! Loaded ${students.length} students.`);
                    await refreshUI();
                } else {
                    if (!silent) showNotify("No valid student records extracted from Google Sheet CSV.");
                }
            } catch (err) {
                console.error(err);
                if (!silent) showNotify("Failed to fetch roster CSV. Please verify network connection.");
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerText = "📥 Sync Roster from Sheet";
                }
            }
        }

        async function performSearch() {
            const query = document.getElementById('nameInput').value.trim().toLowerCase();
            const listDiv = document.getElementById('searchList');
            listDiv.innerHTML = "";
            if (query.length < 2) { quickShow("Enter at least 2 characters"); return; }
            const matches = await db.students.filter(s => s.Name.toLowerCase().includes(query)).limit(20).toArray();
            if (matches.length > 0) {
                listDiv.style.display = 'block';
                listDiv.innerHTML = matches.map(s => `
                    <div class="search-item" onclick="selectStudent('${s.LRN}')">
                        <strong>${s.Name}</strong><small>Grade ${s.Grade} - Section ${s.Section}</small>
                    </div>`).join('') + `<button class="btn-secondary" style="padding:5px; font-size:10px; margin-top:5px;" onclick="closeSearchList()">Close Search</button>`;
            } else { quickShow("No matches found"); }
        }

        function closeSearchList() { document.getElementById('searchList').style.display = 'none'; }

        async function selectStudent(lrn) {
            closeSearchList();
            const student = await db.students.get(lrn);
            if (student) {
                playScanSound();
                document.getElementById('nameText').innerText = student.Name;
                document.getElementById('infoBadge').innerText = `Grade ${student.Grade} | Section ${student.Section}`;
                document.getElementById('lrnText').innerText = student.LRN;
                document.getElementById('scanResult').style.display = 'block';
                
                if (scanner && scanner.getState() === Html5QrcodeScannerState.SCANNING) {
                    try { scanner.pause(true); } catch(e){}
                }
            } else {
                quickShow("QR Code not found in database!");
            }
        }

        function resetDisplay() {
            document.getElementById('scanResult').style.display = 'none';
            if (scanner && scanner.getState() === Html5QrcodeScannerState.PAUSED) {
                try { scanner.resume(); } catch(e) { initScanner(); }
            }
        }

        // --- CAMERA SCANNER LOGIC ---
        async function initScanner() {
            isScannerActive = true;
            document.getElementById('startBtn').style.display = 'none';

            if (scanner) {
                try {
                    await stopScanner();
                    await scanner.clear();
                } catch (e) {}
                scanner = null;
            }

            scanner = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: null };
            
            try {
                await scanner.start(
                    { facingMode: "environment" }, 
                    config, 
                    (text) => selectStudent(text.trim())
                );
            } catch (err) {
                quickShow("Camera Error or Permission Denied"); 
                document.getElementById('startBtn').style.display = 'block'; 
                isScannerActive = false;
            }
        }

        async function stopScanner() {
            if (scanner) {
                const state = scanner.getState();
                if (state === Html5QrcodeScannerState.SCANNING || state === Html5QrcodeScannerState.PAUSED) {
                    try { await scanner.stop(); } catch (e) {}
                }
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.hidden) {
                if (isScannerActive) { await stopScanner(); }
            } else {
                if (isScannerActive && document.getElementById('scanResult').style.display !== 'block') {
                    setTimeout(initScanner, 300);
                }
            }
        });

        // --- LOCAL CSV FILE UPLOAD ---
        function uploadCSV() {
            const file = document.getElementById('csvFile').files[0];
            if (!file) { quickShow("Select a CSV file first"); return; }

            const reader = new FileReader();
            reader.onload = async (e) => {
                const text = e.target.result;
                const rows = parseCSV(text);
                
                if (rows.length < 2) {
                    quickShow("CSV file is empty or invalid.");
                    return;
                }

                const headers = rows[0].map(h => h.toLowerCase());
                const lrnIndex = headers.findIndex(h => h.includes('lrn'));
                const nameIndex = headers.findIndex(h => h.includes('name'));
                const gradeIndex = headers.findIndex(h => h.includes('grade') || h.includes('level'));
                const sectionIndex = headers.findIndex(h => h.includes('section'));

                const students = [];
                for (let i = 1; i < rows.length; i++) {
                    const cleanCols = rows[i];
                    if (cleanCols[lrnIndex] && cleanCols[nameIndex]) {
                        students.push({
                            LRN: cleanCols[lrnIndex],
                            Name: cleanCols[nameIndex],
                            Grade: (gradeIndex !== -1 && cleanCols[gradeIndex]) ? cleanCols[gradeIndex] : 'N/A',
                            Section: (sectionIndex !== -1 && cleanCols[sectionIndex]) ? cleanCols[sectionIndex] : 'N/A'
                        });
                    }
                }

                if (students.length > 0) {
                    await db.students.clear();
                    await db.students.bulkPut(students);
                    quickShow(`Loaded ${students.length} students!`);
                    refreshUI();
                } else {
                    quickShow("No valid students found in CSV.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
